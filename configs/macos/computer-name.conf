# computer-name.conf — this Mac's name (applied by 02-computer-name.sh).
#
# Sets the name shown in Finder/AirDrop/Sharing (ComputerName) and derives
# the network names from it: LocalHostName (Bizarro.local on the network) and
# HostName (what the shell prompt and `hostname` print). The network names
# allow only letters, digits and hyphens; anything else becomes a hyphen.
Bizarro
