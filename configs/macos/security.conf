# security.conf — security baseline (applied by 68-security.sh).
#
# firewall   on|off   macOS application firewall. With it on, macOS asks once
#                     whether an unsigned program (e.g. a local dev server)
#                     may accept incoming connections.
# stealth    on|off   don't answer pings or probes to closed ports
# filevault  check    report whether disk encryption is on. Turning it on
#                     can't be automated: it needs you and prints a recovery key.

firewall   on
stealth    on
filevault  check
