# default-apps.conf — which app opens what (applied by 64-default-apps.sh).
#
#   <bundle-id>  <url-scheme>                 links:      com.brave.Browser  https
#   <bundle-id>  <uniform-type-id>  <role>    documents:  md.obsidian  net.daringfireball.markdown  all
#
# Find a bundle id with: osascript -e 'id of app "Obsidian"'
# Find a file's type id with: mdls -name kMDItemContentType <file>
# Changing the web browser makes macOS ask you to confirm once.

com.brave.Browser   http
com.brave.Browser   https
com.brave.Browser   public.html                   all
md.obsidian         net.daringfireball.markdown   all
