# dock.conf — the Dock's pinned apps, in order (applied by 62-dock.sh).
#
# While this file exists, the Dock holds exactly these apps and no folders or
# stacks. No entries = an empty Dock (how this Mac is set up). Delete the file
# to leave the Dock alone. Apps that aren't installed are skipped.
#
# /Applications/Ghostty.app
# /Applications/Brave Browser.app
# /Applications/Zed.app
