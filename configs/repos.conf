# repos.conf — git repos to have checked out (applied by 45-repos.sh).
#
# One per line: <host>/<owner>/<repo>, which is also where it lands under
# ~/Work, e.g. github.com/thebenwalther/pipeline → ~/Work/github.com/thebenwalther/pipeline.
# Keeping the same paths as the old Mac is what lets Claude Code sessions resume.
# Existing checkouts are never touched. Note: this file is public, so the names
# (not the contents) of private repos listed here are visible.

github.com/thebenwalther/benwalther.com
github.com/thebenwalther/omamas
github.com/thebenwalther/pipeline
github.com/thebenwalther/signalboard
github.com/thebenwalther/waypoint
