# claude-backup.conf — where migrate/claude-backup.sh writes, and what it checks.
# Format: <key> <value>   (~ expands to $HOME; values may contain spaces)
#
# destination  folder that receives encrypted images (claude-<run-id>.dmg)
#              plus a plain-text summary of each (claude-<run-id>.txt)
# scan         folder searched for git repos with uncommitted/unpushed work

destination  ~/Library/Mobile Documents/com~apple~CloudDocs/OmamasClaude
scan         ~/Work
