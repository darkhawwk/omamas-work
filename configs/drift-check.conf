# drift-check.conf — weekly "is this Mac still as declared?" check
# (installed as a LaunchAgent by 70-drift-check.sh; delete this file to remove it).
#
# weekday  0–7 (0 and 7 = Sunday)    hour  0–23    minute  0–59
# skip     modules to leave out; their dry run needs a permission prompt
#          that a background job can't answer

weekday  1
hour     10
minute   0
skip     login-items
